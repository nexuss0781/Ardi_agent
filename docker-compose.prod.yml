version: '3.8'

services:
  ardi-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ardi_full_stack
    ports:
      - "80:80"
      - "5000:5000"
    volumes:
      - ./sessions:/app/backend/sessions
      - ./logs:/var/log/supervisor
    environment:
      - FLASK_ENV=production
      - FLASK_APP=src/main.py
    restart: unless-stopped
    networks:
      - ardi_network

networks:
  ardi_network:
    driver: bridge

volumes:
  sessions_data:
  logs_data:

